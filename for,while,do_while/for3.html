<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>Nama : Adanta Naufal Muqoffa</h4>
    <h4>NIM : 20901022600015</h4>
    <script>
    let nilai = [
    [80, 85],
    [75, 90],
    [90, 95]
    ];
    let total = 0;
    let rata2 = 0;
    for (let i = 0; i < nilai.length; i++) {
        for (let j = 0; j < nilai[i].length; j++) {
            total += nilai[i][j];
            document.write("Mahasiswa " + (i + 1) + ", Mata Kuliah " + (j + 1) + ": " + nilai[i][j] + "<br>");
        }
    }
    rata2 = total / (nilai.length * nilai[0].length);
    document.write("Total nilai: " + total);
    document.write("<br>Rata-rata: " + rata2.toFixed(2));
    </script>
</body>
